spring:
  application:
    name: servicedesk
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/servicedesk}
    username: ${DB_USER:servicedesk}
    password: ${DB_PASSWORD:servicedesk}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
      timeout: 8h
  error:
    include-message: never
    include-stacktrace: never

servicedesk:
  # Seeds two demo organizations on first start (dev profile and docker-compose turn it on).
  seed-demo-data: ${SEED_DEMO_DATA:false}

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui.html

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:INFO}
