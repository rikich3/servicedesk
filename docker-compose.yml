# Full stack: PostgreSQL + API + SPA behind nginx. Demo data is seeded on first start.
#   docker compose up --build
#   open http://localhost:3000  (admin@acme.test / tech@acme.test / user@acme.test, password: password)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: servicedesk
      POSTGRES_USER: servicedesk
      POSTGRES_PASSWORD: servicedesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicedesk -d servicedesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/servicedesk
      DB_USER: servicedesk
      DB_PASSWORD: servicedesk
      SERVICEDESK_SEED_DEMO_DATA: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
